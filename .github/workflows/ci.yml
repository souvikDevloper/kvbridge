name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Strict type check
        shell: bash
        run: |
          set +e
          output=$(python -m mypy src --show-traceback 2>&1)
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            while IFS= read -r line; do
              echo "::error title=mypy::$line"
            done <<< "$output"
            exit "$status"
          fi
      - run: pytest --cov=kvbridge --cov-report=term-missing --cov-fail-under=70
      - run: python -m kvbridge demo --min-r2 0.99
      - run: python -m build
